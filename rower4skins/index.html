<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rower4Skins</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>Rower4Skins - otwieraj skrzynie CS2 i walcz!</h1>
    <div id="balance">Twój rower: 100</div>

    <button id="depositBtn">Wpłać rower (+10)</button>
    <button id="openCaseBtn">Otwórz skrzynię (koszt: 20)</button>

    <h2>Twoje skiny:</h2>
    <ul id="skinsList"></ul>

    <h2>Bitwy</h2>
    <button id="battleBtn">Walcz o skina!</button>
    <div id="battleResult"></div>

    <script src="script.js"></script>
</body>
</html>
