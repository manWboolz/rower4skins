<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rower4Skins</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="top" id="top"></header>
    <section class="dropsbar" id="dropsbar"></section>
    <div class="subbar" id="subbar"></div>

    <main class="wrap" id="app"></main>

    <footer class="foot">
        <div class="wrap">
            <img class="foot-logo" src="img/logo.png" alt="Rower4Skins — twoje skórki rowerowe">
            <div>Wirtualne monety i skiny. Brak prawdziwych pieniędzy, wypłat i przedmiotów Steam. Stan gry zapisuje się tylko w Twojej przeglądarce.</div>
        </div>
    </footer>

    <button class="items-tab" id="itemsTab" data-act="drawer"></button>
    <div class="drawer" id="drawer" hidden></div>
    <div class="modal-bg" id="modal" hidden><div class="modal" id="modalBox"></div></div>
    <div class="toasts" id="toasts"></div>

    <script src="skins.js"></script>
    <script src="script.js"></script>
</body>
</html>
